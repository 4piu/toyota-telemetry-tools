[project]
name = "toyota-telemetry-tools"
version = "0.2.1"
description = "Reusable planning and validation tools for Toyota diagnostic telemetry research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
telemetry-build-plan = "toyota_telemetry.planning:main"
telemetry-analyze-capture = "toyota_telemetry.capture:main"
telemetry-validate = "toyota_telemetry.execution:main"
telemetry-review = "toyota_telemetry.review:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toyota_telemetry"]
