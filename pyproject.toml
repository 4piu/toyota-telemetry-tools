[project]
name = "toyota-telemetry-tools"
version = "0.4.0"
description = "Reusable planning and validation tools for Toyota diagnostic telemetry research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
telemetry = "toyota_telemetry.cli:main"
telemetry-tui = "toyota_telemetry.tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toyota_telemetry"]
